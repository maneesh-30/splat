services:
  falkordb:
    # Pinned by digest so every run uses the exact same FalkorDB build.
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    container_name: falkordb
    ports:
      - "6379:6379" # database (Redis protocol)
      - "3000:3000" # FalkorDB Browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb_data:
