# Render blueprint: one free web service built from the Dockerfile.
services:
  - type: web
    name: splat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Optional. Paste a Groq key in the Render dashboard; it is never stored in the repo.
      - key: GROQ_API_KEY
        sync: false
